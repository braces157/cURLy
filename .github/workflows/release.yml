name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package and inspect imports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist, stage | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/curly.exe" "stage/curly.exe"
          & "stage/curly.exe" --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $dumpbin.FullName /dependents "stage/curly.exe" | Set-Content "stage/dependencies.txt"
          Compress-Archive -Path "stage/*" -DestinationPath "dist/curly-windows-x86_64.zip"
          $hash = (Get-FileHash "dist/curly-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  curly-windows-x86_64.zip" | Set-Content -NoNewline "dist/curly-windows-x86_64.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-pc-windows-msvc
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require an owner-selected license before distribution
        shell: bash
        run: |
          if [ ! -f LICENSE ] && [ ! -f LICENSE.txt ] && [ ! -f LICENSE.md ]; then
            echo "A license has not been selected. Add the owner's chosen license before publishing a release." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
