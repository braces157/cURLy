name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: curly-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: curly-linux-x86_64-musl.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: curly-macos-x86_64.tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: curly-macos-aarch64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Windows artifact and inspect imports
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist, stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/curly.exe" "stage/curly.exe"
          & "stage/curly.exe" --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $dumpbin.FullName /dependents "stage/curly.exe" | Set-Content "stage/dependencies.txt"
          Compress-Archive -Path "stage/*" -DestinationPath "dist/${{ matrix.archive }}"
          $hash = (Get-FileHash "dist/${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.archive }}" | Set-Content -NoNewline "dist/${{ matrix.archive }}.sha256"
      - name: Package Unix artifact and inspect linkage
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist stage
          cp "target/${{ matrix.target }}/release/curly" stage/curly
          chmod +x stage/curly
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              stage/curly --version
              file stage/curly | tee stage/dependencies.txt
              ldd stage/curly >> stage/dependencies.txt 2>&1 || true
              ;;
            x86_64-apple-darwin)
              if [ "$(uname -m)" = "x86_64" ]; then stage/curly --version; fi
              otool -L stage/curly | tee stage/dependencies.txt
              ;;
            aarch64-apple-darwin)
              if [ "$(uname -m)" = "arm64" ]; then stage/curly --version; fi
              otool -L stage/curly | tee stage/dependencies.txt
              ;;
          esac
          tar -C stage -czf "dist/${{ matrix.archive }}" .
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256")
          else
            (cd dist && shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require an owner-selected license before distribution
        shell: bash
        run: |
          if [ ! -f LICENSE ] && [ ! -f LICENSE.txt ] && [ ! -f LICENSE.md ]; then
            echo "A license has not been selected. Add the owner's chosen license before publishing a release." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
