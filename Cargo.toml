[package]
name = "curly"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures-util = "0.3.34"
pathdiff = "0.2.3"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "io-util", "io-std", "sync", "fs"] }
tokio-util = { version = "0.7.18", features = ["io", "rt"] }
toml = "1.1.6"
url = "2.5.8"

[dev-dependencies]
rcgen = "0.14.10"
rustls = "0.23.45"
tempfile = "3.27.0"
